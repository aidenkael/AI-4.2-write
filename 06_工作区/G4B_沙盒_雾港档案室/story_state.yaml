canon_facts:
  - id: canon.memory_archive_exists
    fact: 雾港允许公民将经过认证的个人记忆封存为可用于法律与遗产事务的档案。
    authority: manual_import:sandbox_seed_v1
  - id: canon.memory_package_metadata
    fact: 每份封存记忆至少记录提交者身份、提交日期与封存状态；普通档案员无权随意查看内容。
    authority: manual_import:sandbox_seed_v1
  - id: canon.linwan_officially_dead
    fact: 林晚在当前时间点的官方记录中已死亡三年。
    authority: manual_import:sandbox_seed_v1

character_state:
