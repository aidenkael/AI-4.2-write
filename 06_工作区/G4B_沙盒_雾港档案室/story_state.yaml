open_threads:
  - id: thread.signature_validity
    question: “林晚”身份标记为何能通过档案系统？
    status: open
  - id: thread.submission_origin
    question: 谁实际提交了这份记忆？
    status: open
  - id: thread.postmortem_date
    question: 为什么提交日期晚于官方死亡日期六个月？
    status: open
  - id: thread.linzou_choice
    question: 林昼会按流程上报、忽略，还是冒险进一步查看？
    status: open

approved_plan:
  - id: plan.next_scene
    plan: 当前场景仍不解释谜底；优先采用“读者先感知继续深查存在代价，林昼随后意识到并仍选择继续”的效果目标。具体代价机制在后续场景设计或正文前再决定，未决定前保持候选；本场景详略与节奏按场景功能决定，不把这一方向固化为通用写法。
    status: approved_for_sandbox_test
    authority: author_decision:g4d-dec-001

notes:
  - BKP、AI 推演、未来方案均不得直接写入本文件。
  - 当前没有 accepted_text 来源，因为沙盒尚未生成并验收正文。
  - approved_plan 不是已发生 Canon，可在后续决策中被推翻。
